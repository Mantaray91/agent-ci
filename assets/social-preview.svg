<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="45%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#06080d"/>
    </linearGradient>

    <radialGradient id="cyanGlow" cx="25%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="purpleGlow" cx="80%" cy="65%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85"/>
    </linearGradient>

    <linearGradient id="cyanBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2"/>
    </linearGradient>
    
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.2"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect width="1280" height="640" fill="url(#cyanGlow)"/>
  <rect width="1280" height="640" fill="url(#purpleGlow)"/>

  <!-- Outer Frame with safe 40px margins -->
  <rect x="40" y="40" width="1200" height="560" rx="20" fill="none" stroke="url(#cyanBorder)" stroke-width="1.5"/>

  <!-- Top Status Badge -->
  <g transform="translate(80, 85)">
    <rect width="320" height="34" rx="17" fill="#0f172a" stroke="#0284c7" stroke-width="1"/>
    <circle cx="20" cy="17" r="5" fill="#10b981"/>
    <text x="36" y="22" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">AUTONOMOUS CI // v2.1.1</text>
  </g>

  <!-- Version pill right -->
  <g transform="translate(980, 85)">
    <rect width="220" height="34" rx="17" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="110" y="22" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">MIT OPEN SOURCE</text>
  </g>

  <!-- Main Hero Content -->
  <g transform="translate(80, 195)">
    <!-- Logo Icon & Title -->
    <g transform="translate(0, 0)">
      <!-- Circuit Hexagon Icon -->
      <polygon points="35,0 70,20 70,60 35,80 0,60 0,20" fill="#0284c7" fill-opacity="0.2" stroke="#00e5ff" stroke-width="2.5"/>
      <circle cx="35" cy="40" r="14" fill="#00e5ff" fill-opacity="0.8"/>
      <path d="M 35 15 L 35 30 M 35 50 L 35 65 M 15 40 L 25 40 M 45 40 L 55 40" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
      
      <!-- Brand Name -->
      <text x="95" y="62" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" letter-spacing="-1.5">AGENT-CI</text>
    </g>

    <!-- Subtitle -->
    <text x="5" y="115" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700">Autonomous Self-Improving Pipeline for AI Coding Agents</text>
    <text x="5" y="152" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400">Audits session logs, stops endless tool loops, synthesizes guardrails, and verifies regressions.</text>
  </g>

  <!-- Terminal Installation Box -->
  <g transform="translate(80, 400)">
    <rect width="1120" height="120" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
    
    <!-- Window controls -->
    <circle cx="28" cy="24" r="5" fill="#ef4444"/>
    <circle cx="44" cy="24" r="5" fill="#f59e0b"/>
    <circle cx="60" cy="24" r="5" fill="#10b981"/>
    <text x="85" y="28" fill="#64748b" font-family="'Fira Code', monospace" font-size="12">bash - terminal</text>

    <!-- Terminal Command -->
    <g transform="translate(25, 68)">
      <text x="0" y="0" fill="#38bdf8" font-family="'Fira Code', 'Courier New', monospace" font-size="20" font-weight="700">$</text>
      <text x="24" y="0" fill="#f8fafc" font-family="'Fira Code', 'Courier New', monospace" font-size="20" font-weight="500">npx skills add https://github.com/Mantaray91/agent-ci</text>
    </g>

    <!-- Feature tags below command -->
    <g transform="translate(25, 96)">
      <text x="0" y="0" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">✓ 7-Phase Closed Loop</text>
      <text x="180" y="0" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">✓ Rule Efficacy Lifecycle</text>
      <text x="385" y="0" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">✓ Auto-Rollback on Regression</text>
      <text x="630" y="0" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">✓ Zero Token Overhead</text>
    </g>
  </g>

  <!-- Footer Link -->
  <g transform="translate(80, 568)">
    <text x="0" y="0" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="500">Mantaray91 / agent-ci</text>
    <text x="1120" y="0" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" text-anchor="end">github.com/Mantaray91/agent-ci</text>
  </g>
</svg>
