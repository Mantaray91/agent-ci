<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="40%" stop-color="#0d1424"/>
      <stop offset="100%" stop-color="#05070b"/>
    </linearGradient>

    <radialGradient id="cyanAmbient" cx="20%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="purpleAmbient" cx="80%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="cyanText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="redText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#fca5a5"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <linearGradient id="greenText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161f33" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0b1120" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.15"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.18"/>
    </pattern>
  </defs>

  
    <!-- Base Background -->
    <rect width="1080" height="1350" fill="url(#bg)"/>
    <rect width="1080" height="1350" fill="url(#grid)"/>
    <rect width="1080" height="1350" fill="url(#cyanAmbient)"/>
    <rect width="1080" height="1350" fill="url(#purpleAmbient)"/>

    <!-- Subtle Frame -->
    <rect x="50" y="50" width="980" height="1250" rx="32" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

    <!-- Slide Header -->
    <g transform="translate(90, 110)">
      <text x="0" y="0" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="14" font-weight="700" letter-spacing="2">AGENT-CI // OPEN-SOURCE</text>
      <text x="900" y="0" fill="#64748b" font-family="'Fira Code', monospace" font-size="14" font-weight="700" text-anchor="end">04 / 05</text>
    </g>
    

  <!-- Tag Pill -->
  <g transform="translate(90, 180)">
    <rect width="250" height="42" rx="21" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>
    <circle cx="24" cy="21" r="6" fill="#10b981"/>
    <text x="42" y="27" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" letter-spacing="1">ANTI PROMPT BLOAT</text>
  </g>

  <!-- Headline -->
  <g transform="translate(90, 290)">
    <text x="0" y="0" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="54" font-weight="900">
      <tspan x="0" dy="0">ATURAN JELEK?</tspan>
      <tspan x="0" dy="68" fill="url(#greenText)">OTOMATIS</tspan>
      <tspan x="0" dy="68" fill="url(#greenText)">DIAMPUTASI.</tspan>
    </text>
    <text x="0" y="250" fill="#94a3b8" font-family="sans-serif" font-size="20">
      Seringkali makin banyak prompt, AI makin bego. AGENT-CI punya obatnya:
    </text>
  </g>

  <!-- 3 Lifecycle Pillar Cards -->
  <g transform="translate(90, 610)">
    <!-- Pillar 1 -->
    <g transform="translate(0, 0)">
      <rect width="900" height="130" rx="18" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
      <text x="40" y="48" fill="#38bdf8" font-family="sans-serif" font-size="22" font-weight="800">1. Observasi 7 Hari</text>
      <text x="40" y="85" fill="#cbd5e1" font-family="sans-serif" font-size="16">Setiap guardrail yang dibuat diawasi efikasinya selama seminggu penuh.</text>
    </g>

    <!-- Pillar 2 -->
    <g transform="translate(0, 160)">
      <rect width="900" height="130" rx="18" fill="url(#cardGrad)" stroke="#ef4444" stroke-width="1.2"/>
      <text x="40" y="48" fill="#f87171" font-family="sans-serif" font-size="22" font-weight="800">2. Auto-Pruning (Potong Sampah)</text>
      <text x="40" y="85" fill="#cbd5e1" font-family="sans-serif" font-size="16">Kalau aturan gak bikin error berkurang minimal 20%, langsung dihapus!</text>
    </g>

    <!-- Pillar 3 -->
    <g transform="translate(0, 320)">
      <rect width="900" height="130" rx="18" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.2"/>
      <text x="40" y="48" fill="#10b981" font-family="sans-serif" font-size="22" font-weight="800">3. Rule Evolution (Berevolusi)</text>
      <text x="40" y="85" fill="#cbd5e1" font-family="sans-serif" font-size="16">Error masih bandel? Sistem mensintesis aturan versi baru yang lebih ketat.</text>
    </g>
  </g>

  <!-- Bottom -->
  <g transform="translate(90, 1180)">
    <text x="0" y="0" fill="#94a3b8" font-family="sans-serif" font-size="18">Hasilnya: Prompt tetap ramping, agent tetap patuh.</text>
    <text x="900" y="0" fill="#38bdf8" font-family="sans-serif" font-size="18" font-weight="700" text-anchor="end">COBA SEKARANG ➔</text>
  </g>
</svg>
