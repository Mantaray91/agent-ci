<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="40%" stop-color="#0d1424"/>
      <stop offset="100%" stop-color="#05070b"/>
    </linearGradient>

    <radialGradient id="cyanAmbient" cx="20%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="purpleAmbient" cx="80%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="cyanText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="redText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#fca5a5"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <linearGradient id="greenText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161f33" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0b1120" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.15"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.18"/>
    </pattern>
  </defs>

  
    <!-- Base Background -->
    <rect width="1080" height="1350" fill="url(#bg)"/>
    <rect width="1080" height="1350" fill="url(#grid)"/>
    <rect width="1080" height="1350" fill="url(#cyanAmbient)"/>
    <rect width="1080" height="1350" fill="url(#purpleAmbient)"/>

    <!-- Subtle Frame -->
    <rect x="50" y="50" width="980" height="1250" rx="32" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

    <!-- Slide Header -->
    <g transform="translate(90, 110)">
      <text x="0" y="0" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="14" font-weight="700" letter-spacing="2">AGENT-CI // OPEN-SOURCE</text>
      <text x="900" y="0" fill="#64748b" font-family="'Fira Code', monospace" font-size="14" font-weight="700" text-anchor="end">01 / 05</text>
    </g>
    

  <!-- Tag Pill -->
  <g transform="translate(90, 180)">
    <rect width="280" height="42" rx="21" fill="#0f172a" stroke="#0284c7" stroke-width="1.2"/>
    <circle cx="24" cy="21" r="6" fill="#10b981"/>
    <text x="42" y="27" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" letter-spacing="1">BUKAN PROGRAMMER</text>
  </g>

  <!-- Massive Headline -->
  <g transform="translate(90, 310)">
    <text x="0" y="0" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="64" font-weight="900" line-height="1.15">
      <tspan x="0" dy="0">SAYA BUKAN</tspan>
      <tspan x="0" dy="78">CODER,</tspan>
      <tspan x="0" dy="78" fill="url(#cyanText)">TAPI BIKIN AI</tspan>
      <tspan x="0" dy="78" fill="url(#cyanText)">BISA NGE-FIX</tspan>
      <tspan x="0" dy="78">DIRINYA SENDIRI.</tspan>
    </text>
  </g>

  <!-- Core Visual Graphic Card -->
  <g transform="translate(90, 760)">
    <rect width="900" height="340" rx="24" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>

    <!-- Glowing Hexagon Node -->
    <g transform="translate(60, 60)">
      <polygon points="50,0 100,28 100,85 50,114 0,85 0,28" fill="#0284c7" fill-opacity="0.25" stroke="#00e5ff" stroke-width="3"/>
      <circle cx="50" cy="57" r="18" fill="#00e5ff"/>
    </g>

    <!-- Info inside card -->
    <g transform="translate(200, 80)">
      <text x="0" y="0" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="800">AGENT-CI v2.1.1</text>
      <text x="0" y="36" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18">Autonomous Self-Healing Loop for Coding Agents</text>
      
      <!-- Metrics row -->
      <g transform="translate(0, 95)">
        <rect width="180" height="60" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
        <text x="20" y="26" fill="#64748b" font-family="sans-serif" font-size="12">LOOP FAILURE</text>
        <text x="20" y="50" fill="#10b981" font-family="sans-serif" font-size="20" font-weight="800">-85% DROP</text>

        <rect x="200" width="180" height="60" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
        <text x="220" y="26" fill="#64748b" font-family="sans-serif" font-size="12">HEALTH SCORE</text>
        <text x="220" y="50" fill="#38bdf8" font-family="sans-serif" font-size="20" font-weight="800">96.4% PEAK</text>

        <rect x="400" width="220" height="60" rx="12" fill="#0f172a" stroke="#818cf8" stroke-width="1"/>
        <text x="420" y="26" fill="#64748b" font-family="sans-serif" font-size="12">CODE EVAL</text>
        <text x="420" y="50" fill="#818cf8" font-family="sans-serif" font-size="20" font-weight="800">100% PASSING</text>
      </g>
    </g>
  </g>

  <!-- Bottom Swipe Indicator -->
  <g transform="translate(90, 1200)">
    <text x="0" y="0" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="600">Kisah di baliknya &amp; cara kerjanya</text>
    <text x="900" y="0" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700" text-anchor="end">GESER ➔</text>
  </g>
</svg>
