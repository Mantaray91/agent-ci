<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="40%" stop-color="#0d1424"/>
      <stop offset="100%" stop-color="#05070b"/>
    </linearGradient>

    <radialGradient id="cyanAmbient" cx="20%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="purpleAmbient" cx="80%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="cyanText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="redText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#fca5a5"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <linearGradient id="greenText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161f33" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0b1120" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.15"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.18"/>
    </pattern>
  </defs>

  
    <!-- Base Background -->
    <rect width="1080" height="1350" fill="url(#bg)"/>
    <rect width="1080" height="1350" fill="url(#grid)"/>
    <rect width="1080" height="1350" fill="url(#cyanAmbient)"/>
    <rect width="1080" height="1350" fill="url(#purpleAmbient)"/>

    <!-- Subtle Frame -->
    <rect x="50" y="50" width="980" height="1250" rx="32" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

    <!-- Slide Header -->
    <g transform="translate(90, 110)">
      <text x="0" y="0" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="14" font-weight="700" letter-spacing="2">AGENT-CI // OPEN-SOURCE</text>
      <text x="900" y="0" fill="#64748b" font-family="'Fira Code', monospace" font-size="14" font-weight="700" text-anchor="end">03 / 05</text>
    </g>
    

  <!-- Tag Pill -->
  <g transform="translate(90, 180)">
    <rect width="250" height="42" rx="21" fill="#0f172a" stroke="#00e5ff" stroke-width="1.2"/>
    <circle cx="24" cy="21" r="6" fill="#00e5ff"/>
    <text x="42" y="27" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" letter-spacing="1">THE BREAKTHROUGH</text>
  </g>

  <!-- Headline -->
  <g transform="translate(90, 290)">
    <text x="0" y="0" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="54" font-weight="900">
      <tspan x="0" dy="0">JANGAN DI-PROMPT.</tspan>
      <tspan x="0" dy="68" fill="url(#cyanText)">KASIH SISTEM CI</tspan>
      <tspan x="0" dy="68">YANG NGE-AUDIT.</tspan>
    </text>
  </g>

  <!-- 4 Step Flow Cards -->
  <g transform="translate(90, 560)">
    <!-- Step 1 -->
    <g transform="translate(0, 0)">
      <rect width="900" height="100" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
      <circle cx="50" cy="50" r="22" fill="#0284c7" fill-opacity="0.3"/>
      <text x="50" y="56" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="18" font-weight="800" text-anchor="middle">01</text>
      <text x="100" y="42" fill="#f8fafc" font-family="sans-serif" font-size="22" font-weight="800">Audit Log Sesi Otomatis</text>
      <text x="100" y="70" fill="#94a3b8" font-family="sans-serif" font-size="15">Baca riwayat sesi (.jsonl), deteksi tool mana yang macet/looping.</text>
    </g>

    <!-- Step 2 -->
    <g transform="translate(0, 125)">
      <rect width="900" height="100" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
      <circle cx="50" cy="50" r="22" fill="#0284c7" fill-opacity="0.3"/>
      <text x="50" y="56" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="18" font-weight="800" text-anchor="middle">02</text>
      <text x="100" y="42" fill="#f8fafc" font-family="sans-serif" font-size="22" font-weight="800">Kalkulasi Skor Kesehatan</text>
      <text x="100" y="70" fill="#94a3b8" font-family="sans-serif" font-size="15">Hitung loop rate, tingkat koreksi user, dan learning rate (0.0 - 1.0).</text>
    </g>

    <!-- Step 3 -->
    <g transform="translate(0, 250)">
      <rect width="900" height="100" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
      <circle cx="50" cy="50" r="22" fill="#0284c7" fill-opacity="0.3"/>
      <text x="50" y="56" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="18" font-weight="800" text-anchor="middle">03</text>
      <text x="100" y="42" fill="#f8fafc" font-family="sans-serif" font-size="22" font-weight="800">Sintesis Guardrail Baru</text>
      <text x="100" y="70" fill="#94a3b8" font-family="sans-serif" font-size="15">Otomatis racik instruksi pencegahan spesifik ke file rules agent.</text>
    </g>

    <!-- Step 4 -->
    <g transform="translate(0, 375)">
      <rect width="900" height="100" rx="16" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.5"/>
      <circle cx="50" cy="50" r="22" fill="#10b981" fill-opacity="0.3"/>
      <text x="50" y="56" fill="#10b981" font-family="'Fira Code', monospace" font-size="18" font-weight="800" text-anchor="middle">04</text>
      <text x="100" y="42" fill="#f8fafc" font-family="sans-serif" font-size="22" font-weight="800">Auto-Rollback Kalau Gagal</text>
      <text x="100" y="70" fill="#6ee7b7" font-family="sans-serif" font-size="15">Uji performa. Kalau skor drop &gt;5%, otomatis git revert tanpa ragu.</text>
    </g>
  </g>

  <!-- Bottom -->
  <g transform="translate(90, 1180)">
    <text x="0" y="0" fill="#94a3b8" font-family="sans-serif" font-size="18">Bukan sekadar prompt, ini mesin rekayasa sistem.</text>
    <text x="900" y="0" fill="#38bdf8" font-family="sans-serif" font-size="18" font-weight="700" text-anchor="end">FITUR UNIK ➔</text>
  </g>
</svg>
