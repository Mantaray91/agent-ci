<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="40%" stop-color="#0d1424"/>
      <stop offset="100%" stop-color="#05070b"/>
    </linearGradient>

    <radialGradient id="cyanAmbient" cx="20%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="purpleAmbient" cx="80%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="cyanText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="redText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#fca5a5"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <linearGradient id="greenText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161f33" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0b1120" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.15"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.18"/>
    </pattern>
  </defs>

  
    <!-- Base Background -->
    <rect width="1080" height="1350" fill="url(#bg)"/>
    <rect width="1080" height="1350" fill="url(#grid)"/>
    <rect width="1080" height="1350" fill="url(#cyanAmbient)"/>
    <rect width="1080" height="1350" fill="url(#purpleAmbient)"/>

    <!-- Subtle Frame -->
    <rect x="50" y="50" width="980" height="1250" rx="32" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

    <!-- Slide Header -->
    <g transform="translate(90, 110)">
      <text x="0" y="0" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="14" font-weight="700" letter-spacing="2">AGENT-CI // OPEN-SOURCE</text>
      <text x="900" y="0" fill="#64748b" font-family="'Fira Code', monospace" font-size="14" font-weight="700" text-anchor="end">05 / 05</text>
    </g>
    

  <!-- Tag Pill -->
  <g transform="translate(90, 180)">
    <rect width="260" height="42" rx="21" fill="#0f172a" stroke="#00e5ff" stroke-width="1.2"/>
    <circle cx="24" cy="21" r="6" fill="#00e5ff"/>
    <text x="42" y="27" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" letter-spacing="1">100% OPEN SOURCE</text>
  </g>

  <!-- Headline -->
  <g transform="translate(90, 290)">
    <text x="0" y="0" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="54" font-weight="900">
      <tspan x="0" dy="0">GRATIS DI GITHUB.</tspan>
      <tspan x="0" dy="68" fill="url(#cyanText)">INSTALL CUKUP</tspan>
      <tspan x="0" dy="68">1 BARIS PERINTAH.</tspan>
    </text>
  </g>

  <!-- Terminal Command Box -->
  <g transform="translate(90, 560)">
    <rect width="900" height="180" rx="20" fill="#090d16" stroke="#00e5ff" stroke-width="2"/>
    
    <!-- Top Bar -->
    <g transform="translate(30, 30)">
      <circle cx="0" cy="0" r="6" fill="#ef4444"/>
      <circle cx="20" cy="0" r="6" fill="#f59e0b"/>
      <circle cx="40" cy="0" r="6" fill="#10b981"/>
      <text x="70" y="5" fill="#64748b" font-family="'Fira Code', monospace" font-size="14">terminal - install agent-ci</text>
    </g>

    <!-- Command -->
    <g transform="translate(30, 95)">
      <text x="0" y="0" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="20" font-weight="700">$</text>
      <text x="25" y="0" fill="#f8fafc" font-family="'Fira Code', monospace" font-size="17" font-weight="500">npx skills add https://github.com/Mantaray91/agent-ci</text>
    </g>

    <!-- Note -->
    <text x="30" y="140" fill="#10b981" font-family="sans-serif" font-size="14" font-weight="600">✓ Langsung terpasang ke agent kamu (Antigravity, Claude, Cline, dll)</text>
  </g>

  <!-- Big Repository Card -->
  <g transform="translate(90, 780)">
    <rect width="900" height="260" rx="20" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    
    <g transform="translate(50, 60)">
      <text x="0" y="0" fill="#64748b" font-family="sans-serif" font-size="16" font-weight="600">GITHUB REPOSITORY</text>
      <text x="0" y="44" fill="#ffffff" font-family="sans-serif" font-size="36" font-weight="900">github.com/Mantaray91/agent-ci</text>
      <text x="0" y="85" fill="#38bdf8" font-family="sans-serif" font-size="18">★ Tinggalkan bintang (Star) &amp; dukung open-source ini!</text>

      <g transform="translate(0, 120)">
        <rect width="200" height="38" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
        <text x="100" y="24" fill="#10b981" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">MIT LICENSE</text>

        <rect x="220" width="220" height="38" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
        <text x="330" y="24" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">v2.1.1 LATEST</text>
      </g>
    </g>
  </g>

  <!-- Bottom CTA -->
  <g transform="translate(90, 1180)">
    <text x="0" y="0" fill="#f8fafc" font-family="sans-serif" font-size="22" font-weight="800">🔗 Link langsung ada di Bio profil saya!</text>
    <text x="900" y="0" fill="#38bdf8" font-family="sans-serif" font-size="20" font-weight="800" text-anchor="end">SAVE &amp; SHARE 🔥</text>
  </g>
</svg>
