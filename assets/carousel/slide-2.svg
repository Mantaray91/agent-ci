<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="40%" stop-color="#0d1424"/>
      <stop offset="100%" stop-color="#05070b"/>
    </linearGradient>

    <radialGradient id="cyanAmbient" cx="20%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="purpleAmbient" cx="80%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="cyanText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="redText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#fca5a5"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <linearGradient id="greenText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161f33" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0b1120" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.15"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.18"/>
    </pattern>
  </defs>

  
    <!-- Base Background -->
    <rect width="1080" height="1350" fill="url(#bg)"/>
    <rect width="1080" height="1350" fill="url(#grid)"/>
    <rect width="1080" height="1350" fill="url(#cyanAmbient)"/>
    <rect width="1080" height="1350" fill="url(#purpleAmbient)"/>

    <!-- Subtle Frame -->
    <rect x="50" y="50" width="980" height="1250" rx="32" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

    <!-- Slide Header -->
    <g transform="translate(90, 110)">
      <text x="0" y="0" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="14" font-weight="700" letter-spacing="2">AGENT-CI // OPEN-SOURCE</text>
      <text x="900" y="0" fill="#64748b" font-family="'Fira Code', monospace" font-size="14" font-weight="700" text-anchor="end">02 / 05</text>
    </g>
    

  <!-- Tag Pill -->
  <g transform="translate(90, 180)">
    <rect width="250" height="42" rx="21" fill="#0f172a" stroke="#ef4444" stroke-width="1.2"/>
    <circle cx="24" cy="21" r="6" fill="#ef4444"/>
    <text x="42" y="27" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" letter-spacing="1">MASALAH NYATA</text>
  </g>

  <!-- Headline -->
  <g transform="translate(90, 290)">
    <text x="0" y="0" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="56" font-weight="900">
      <tspan x="0" dy="0">AI CODING LO</tspan>
      <tspan x="0" dy="70" fill="url(#redText)">PERNAH MABUK</tspan>
      <tspan x="0" dy="70" fill="url(#redText)">LOOPING GAJELAS?</tspan>
    </text>
    <text x="0" y="260" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20">
      Manggil tool yang sama 10x, error, coba lagi, token habis sia-sia.
    </text>
  </g>

  <!-- Simulated Terminal Pain Card -->
  <g transform="translate(90, 620)">
    <rect width="900" height="460" rx="20" fill="#090d16" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Window Bar -->
    <g transform="translate(30, 30)">
      <circle cx="0" cy="0" r="6" fill="#ef4444"/>
      <circle cx="20" cy="0" r="6" fill="#f59e0b"/>
      <circle cx="40" cy="0" r="6" fill="#10b981"/>
      <text x="70" y="5" fill="#64748b" font-family="'Fira Code', monospace" font-size="14">terminal — session-fail.log</text>
    </g>

    <!-- Error Lines -->
    <g transform="translate(30, 90)" font-family="'Fira Code', monospace" font-size="16">
      <text x="0" y="0" fill="#ef4444">[ERROR] Tool 'run_command' timed out after 30000ms</text>
      <text x="0" y="34" fill="#f59e0b">Agent: "Let me retry running the exact same command..."</text>
      <text x="0" y="74" fill="#ef4444">[ERROR] Tool 'run_command' timed out after 30000ms</text>
      <text x="0" y="108" fill="#f59e0b">Agent: "Let me retry again with identical parameters..."</text>
      <text x="0" y="148" fill="#ef4444">[ERROR] Maximum execution loop reached (10/10 retries)</text>
      
      <line x1="0" y1="180" x2="840" y2="180" stroke="#1e293b" stroke-width="1.5"/>

      <!-- Penalty Stat Box -->
      <g transform="translate(0, 220)">
        <text x="0" y="0" fill="#f87171" font-size="24" font-weight="700">💸 45.000 Token Hangus</text>
        <text x="0" y="32" fill="#94a3b8" font-size="16">Waktu terbuang 3 menit, file kode tetap berantakan.</text>
      </g>
      <g transform="translate(480, 220)">
        <text x="0" y="0" fill="#f87171" font-size="24" font-weight="700">😫 Capek Ngoreksi</text>
        <text x="0" y="32" fill="#94a3b8" font-size="16">Besoknya pas buka sesi baru, AI lupa lagi.</text>
      </g>
    </g>
  </g>

  <!-- Bottom Quote -->
  <g transform="translate(90, 1150)">
    <text x="0" y="0" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="600">"Prompt manual 5 halaman bukan solusi. Butuh sistem."</text>
    <text x="900" y="0" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700" text-anchor="end">SOLUSINYA ➔</text>
  </g>
</svg>
